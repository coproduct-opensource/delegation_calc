name: Aeneas Drift

# Verifies the Aeneas-generated Lean translation of `crates/dlc-core` matches
# the committed `lean/DLC/Aeneas/DlcCore/` output. A non-clean diff is a
# soundness break: T1 would prove a Lean function no longer corresponding to
# the Rust.
#
# Uses the canonical `coproduct-opensource/aeneas-ci` composite action
# (sibling repo with the freshness-check pattern packaged for reuse).
# Charon + Aeneas are PINNED (see the `with:` block) — never `main`, which
# floats and silently re-drifts the committed tree whenever upstream moves.
# Bump the pin deliberately + regenerate in one PR.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/dlc-core/**"
      - "crates/dlc-d-rsm/**"
      - "lean/DLC/Aeneas/**"
      - "lean/DLCD/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  pull_request:
    paths:
      - "crates/dlc-core/**"
      - "crates/dlc-d-rsm/**"
      - "lean/DLC/Aeneas/**"
      - "lean/DLCD/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  # Weekly reproducibility canary: re-regenerates from the PINNED toolchain and
  # confirms the committed tree still matches bit-for-bit (catches a hand-edited
  # generated file or a vanished pinned ref — NOT upstream drift, which pinning
  # already excludes).
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Aeneas Rust → Lean drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: coproduct-opensource/aeneas-ci@v1.0.4
        id: aeneas
        with:
          rust-source-dir: crates/dlc-core
          lean-output-dir: lean/DLC/Aeneas/DlcCore
          # PINNED Charon ↔ Aeneas pair (NOT `main` — floating refs guarantee
          # weekly drift). The pin is THE PAIR THAT GENERATED THE COMMITTED
          # TREES — this gate checks rust ↔ committed-Lean freshness, so the
          # generator must reproduce the committed output byte-for-byte:
          # aeneas nightly-2026.07.12-d71d2e3 with charon 6bd9163 (the local
          # symlinked-charon setup; aeneas's own charon-pin hash check is
          # skipped for symlinks, in CI and locally alike).
          # NOTE the deliberate split: the *Lean library* the trees BUILD
          # against is `lean/lakefile.lean`'s `require aeneas @ ad905f5`
          # (nightly-2026.07.23). Cross-version compatibility is not assumed —
          # it is evidenced by `lake build DLC` green on the committed trees.
          # First honest CI run of this gate (2026-07-30) proved the previous
          # same-pin-as-lakefile setting wrong: ad905f5 regenerates a
          # >200-line different tree, so pinning the generator to the library
          # rev made the freshness gate fail on freshly-generated code.
          # To bump: raise aeneas-version + charon-version AND the lakefile
          # `require aeneas` rev together, regenerate BOTH trees with those
          # binaries, repair any proof fallout, commit — all in ONE PR.
          aeneas-version: nightly-2026.07.12-d71d2e3
          charon-version: 6bd9163653707dcb07b0e78e8f694d0de448d69c
          # Drift is a hard error (soundness gate): a non-clean diff means the
          # Lean we prove no longer corresponds to the Rust.
          fail-on-drift: 'true'

      # SECOND Charon target (DLC-D Phase R2.1): the verified-runtime-core crate
      # `dlc-d-rsm`, whose Aeneas image mirrors `lean/DLCD/Rsm.lean`. It
      # path-depends on `dlc-core`, so its single `dlc_d_rsm.llbc` INLINES
      # `dlc_core` into one self-contained `DlcDRsm` tree — translated
      # independently of target #1, same PINNED Charon ↔ Aeneas pair (both trees
      # must build against the one `require aeneas @ <rev>` in the lakefile).
      # R2.1 ships NO correspondence proof; this gate fixes the translated
      # artifact so the refinement (R2.2–R2.4) has a drift-stable target.
      - uses: coproduct-opensource/aeneas-ci@v1.0.4
        id: aeneas-dlcd-rsm
        with:
          rust-source-dir: crates/dlc-d-rsm
          lean-output-dir: lean/DLCD/Aeneas/DlcDRsm
          aeneas-version: nightly-2026.07.12-d71d2e3
          charon-version: 6bd9163653707dcb07b0e78e8f694d0de448d69c
          fail-on-drift: 'true'

      # Upload the regenerated Lean as artifacts so maintainers can download,
      # inspect, and commit them (bootstrap) — one per target.
      - name: Upload Aeneas-generated Lean (dlc-core artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-generated-lean
          path: lean/DLC/Aeneas/DlcCore/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Aeneas-generated Lean (dlc-d-rsm artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-generated-lean-dlcd-rsm
          path: lean/DLCD/Aeneas/DlcDRsm/
          if-no-files-found: ignore
          retention-days: 14
