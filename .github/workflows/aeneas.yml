name: Aeneas Drift

# Verifies the Aeneas-generated Lean translation of `crates/dlc-core` matches
# the committed `lean/DLC/Aeneas/DlcCore/` output. A non-clean diff is a
# soundness break: T1 would prove a Lean function no longer corresponding to
# the Rust.
#
# Uses the canonical `coproduct-opensource/aeneas-ci` composite action
# (sibling repo with the freshness-check pattern packaged for reuse).
# Bootstrap mode: `fail-on-drift: false` until the first Aeneas-generated
# Lean tree is committed to `lean/DLC/Aeneas/DlcCore/`. Then flip to true.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/dlc-core/**"
      - "lean/DLC/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  pull_request:
    paths:
      - "crates/dlc-core/**"
      - "lean/DLC/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  # Weekly canary catches Charon / Aeneas toolchain drift.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Aeneas Rust → Lean drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: coproduct-opensource/aeneas-ci@v1.0.0
        id: aeneas
        with:
          rust-source-dir: crates/dlc-core
          lean-output-dir: lean/DLC/Aeneas/DlcCore
          # Pin to a recent Charon ↔ Aeneas compatible pair. Bump together,
          # never independently. See AeneasVerif/aeneas/charon-pin for the
          # current matched ref. Using `main` initially while bootstrapping;
          # pin to specific SHAs after the first generated tree lands.
          charon-version: main
          aeneas-version: main
          # Bootstrap: lean/DLC/Aeneas/DlcCore/ doesn't exist yet, so the
          # first run will produce drift by definition. Flip to 'true' once
          # the generated tree is committed.
          fail-on-drift: 'false'

      # Upload the regenerated Lean as an artifact so maintainers can
      # download, inspect, and commit it (bootstrap).
      - name: Upload Aeneas-generated Lean (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-generated-lean
          path: lean/DLC/Aeneas/DlcCore/
          if-no-files-found: ignore
          retention-days: 14
