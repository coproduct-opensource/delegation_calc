name: Aeneas Drift

# Verifies the Aeneas-generated Lean translation of `crates/dlc-core` matches
# the committed `lean/DLC/Aeneas/DlcCore/` output. A non-clean diff is a
# soundness break: T1 would prove a Lean function no longer corresponding to
# the Rust.
#
# Uses the canonical `coproduct-opensource/aeneas-ci` composite action
# (sibling repo with the freshness-check pattern packaged for reuse).
# Charon + Aeneas are PINNED (see the `with:` block) — never `main`, which
# floats and silently re-drifts the committed tree whenever upstream moves.
# Bump the pin deliberately + regenerate in one PR.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/dlc-core/**"
      - "crates/dlc-d-rsm/**"
      - "lean/DLC/Aeneas/**"
      - "lean/DLCD/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  pull_request:
    paths:
      - "crates/dlc-core/**"
      - "crates/dlc-d-rsm/**"
      - "lean/DLC/Aeneas/**"
      - "lean/DLCD/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  # Weekly reproducibility canary: re-regenerates from the PINNED toolchain and
  # confirms the committed tree still matches bit-for-bit (catches a hand-edited
  # generated file or a vanished pinned ref — NOT upstream drift, which pinning
  # already excludes).
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Aeneas Rust → Lean drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: coproduct-opensource/aeneas-ci@v1.0.6
        id: aeneas
        with:
          rust-source-dir: crates/dlc-core
          lean-output-dir: lean/DLC/Aeneas/DlcCore
          # PINNED Charon ↔ Aeneas pair (NOT `main` — floating refs guarantee
          # weekly drift; coherent pair per aeneas's charon-pin; matches the
          # lakefile's `require aeneas @ ad905f5` library rev AND the local
          # cached binaries scripts/aeneas-translate.sh prefers).
          # HISTORY (2026-07-30, first honest CI run of this gate): the gate
          # RED'd and the pins were briefly blamed and swapped to the local
          # fallback pair — wrongly. The actual delta was the five Charon
          # `--opaque` flags below, which the local scripts always passed and
          # this workflow never did: without them the regenerated tree carries
          # the derived Debug/Hash impl bodies (~750 lines) the committed tree
          # opacifies. Pins restored; flags now passed. The charon-extra-args /
          # charon-toolchain lists MUST stay byte-identical to
          # scripts/aeneas-translate.sh and scripts/check-drift.sh.
          # To bump the pair: raise both + the lakefile rev together,
          # regenerate BOTH trees, repair proof fallout, one PR.
          aeneas-version: nightly-2026.07.23-ad905f5
          charon-version: cb50ff16b9f1066b8a97dc06da704de2da2fa41c
          charon-toolchain: nightly-2026-06-01
          charon-extra-args: >-
            --preset aeneas
            --opaque 'dlc_core::principal::{impl core::fmt::Debug for dlc_core::principal::Principal}'
            --opaque 'dlc_core::obligation::{impl core::fmt::Debug for dlc_core::obligation::Obligation}'
            --opaque 'dlc_core::syntax::{impl core::fmt::Debug for dlc_core::syntax::Prop}'
            --opaque 'dlc_core::syntax::{impl core::fmt::Debug for dlc_core::syntax::Term}'
            --opaque 'dlc_core::principal::{impl core::hash::Hash for dlc_core::principal::Principal}'
          # Drift is a hard error (soundness gate): a non-clean diff means the
          # Lean we prove no longer corresponds to the Rust.
          fail-on-drift: 'true'

      # SECOND Charon target (DLC-D Phase R2.1): the verified-runtime-core crate
      # `dlc-d-rsm`, whose Aeneas image mirrors `lean/DLCD/Rsm.lean`. It
      # path-depends on `dlc-core`, so its single `dlc_d_rsm.llbc` INLINES
      # `dlc_core` into one self-contained `DlcDRsm` tree — translated
      # independently of target #1, same PINNED Charon ↔ Aeneas pair (both trees
      # must build against the one `require aeneas @ <rev>` in the lakefile).
      # R2.1 ships NO correspondence proof; this gate fixes the translated
      # artifact so the refinement (R2.2–R2.4) has a drift-stable target.
      - uses: coproduct-opensource/aeneas-ci@v1.0.6
        id: aeneas-dlcd-rsm
        with:
          rust-source-dir: crates/dlc-d-rsm
          lean-output-dir: lean/DLCD/Aeneas/DlcDRsm
          aeneas-version: nightly-2026.07.23-ad905f5
          charon-version: cb50ff16b9f1066b8a97dc06da704de2da2fa41c
          charon-toolchain: nightly-2026-06-01
          # Same opaque list as target #1 (the dlc_d_rsm tree INLINES dlc_core,
          # so the same Debug/Hash impls appear here) — keep byte-identical to
          # scripts/aeneas-translate.sh / scripts/check-drift.sh.
          charon-extra-args: >-
            --preset aeneas
            --opaque 'dlc_core::principal::{impl core::fmt::Debug for dlc_core::principal::Principal}'
            --opaque 'dlc_core::obligation::{impl core::fmt::Debug for dlc_core::obligation::Obligation}'
            --opaque 'dlc_core::syntax::{impl core::fmt::Debug for dlc_core::syntax::Prop}'
            --opaque 'dlc_core::syntax::{impl core::fmt::Debug for dlc_core::syntax::Term}'
            --opaque 'dlc_core::principal::{impl core::hash::Hash for dlc_core::principal::Principal}'
          fail-on-drift: 'true'

      # Upload the regenerated Lean as artifacts so maintainers can download,
      # inspect, and commit them (bootstrap) — one per target.
      - name: Upload Aeneas-generated Lean (dlc-core artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aeneas-generated-lean
          path: lean/DLC/Aeneas/DlcCore/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Aeneas-generated Lean (dlc-d-rsm artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-generated-lean-dlcd-rsm
          path: lean/DLCD/Aeneas/DlcDRsm/
          if-no-files-found: ignore
          retention-days: 14
