name: Aeneas Drift

# Verifies the Aeneas-generated Lean translation of `crates/dlc-core` matches
# the committed `lean/DLC/Aeneas/DlcCore/` output. A non-clean diff is a
# soundness break: T1 would prove a Lean function no longer corresponding to
# the Rust.
#
# Uses the canonical `coproduct-opensource/aeneas-ci` composite action
# (sibling repo with the freshness-check pattern packaged for reuse).
# Charon + Aeneas are PINNED (see the `with:` block) — never `main`, which
# floats and silently re-drifts the committed tree whenever upstream moves.
# Bump the pin deliberately + regenerate in one PR.

on:
  push:
    branches: ["main"]
    paths:
      - "crates/dlc-core/**"
      - "lean/DLC/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  pull_request:
    paths:
      - "crates/dlc-core/**"
      - "lean/DLC/Aeneas/**"
      - ".github/workflows/aeneas.yml"
  # Weekly reproducibility canary: re-regenerates from the PINNED toolchain and
  # confirms the committed tree still matches bit-for-bit (catches a hand-edited
  # generated file or a vanished pinned ref — NOT upstream drift, which pinning
  # already excludes).
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Aeneas Rust → Lean drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: coproduct-opensource/aeneas-ci@v1.0.2
        id: aeneas
        with:
          rust-source-dir: crates/dlc-core
          lean-output-dir: lean/DLC/Aeneas/DlcCore
          # PINNED Charon ↔ Aeneas pair (NOT `main` — floating refs guarantee
          # weekly drift; the committed tree was silently regenerated only when
          # upstream moved). TWO constraints on this pin:
          #   1. coherent pair — `charon-version` is `aeneas-version`'s own
          #      `charon-pin` (read at the tag:
          #      AeneasVerif/aeneas/charon-pin?ref=<aeneas-version>);
          #   2. it must stay compatible with the Aeneas *Lean library* the
          #      generated tree is built against — see `lean/lakefile.lean`'s
          #      `require aeneas ... @ <rev>`. The binary that GENERATES the tree
          #      and the library that BUILDS it (`lake build DLC`) must agree, or
          #      a clean drift still fails to compile. This pair matches
          #      nucleus-platform's proven pin (the sibling Aeneas user).
          # To bump: raise aeneas-version + its charon-pin AND the lakefile
          # `require aeneas` rev together, regenerate (the action uploads the
          # `aeneas-generated-lean` artifact on drift), commit — all in ONE PR.
          aeneas-version: nightly-2026.05.30
          charon-version: e069223a672abe012e55a36289d2eae03df208c0
          # Drift is a hard error (soundness gate): a non-clean diff means the
          # Lean we prove no longer corresponds to the Rust.
          fail-on-drift: 'true'

      # Upload the regenerated Lean as an artifact so maintainers can
      # download, inspect, and commit it (bootstrap).
      - name: Upload Aeneas-generated Lean (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeneas-generated-lean
          path: lean/DLC/Aeneas/DlcCore/
          if-no-files-found: ignore
          retention-days: 14
