name: IETF Draft

# Builds and validates the draft-ietf/draft-crisp-dlc-token-00.xml via
# xml2rfc + idnits per the audit closure checklist (item 6).

on:
  push:
    branches: ["main"]
    paths:
      - "draft-ietf/**"
      - "scripts/check-draft-ietf.sh"
      - ".github/workflows/draft-ietf.yml"
  pull_request:
    paths:
      - "draft-ietf/**"
      - "scripts/check-draft-ietf.sh"
      - ".github/workflows/draft-ietf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: draft-ietf xml2rfc + idnits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install xml2rfc + xmllint + idnits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y \
            python3-pip libxml2-utils
          pip3 install --quiet xml2rfc
          # idnits from the IETF tools repo.
          curl -sSL https://github.com/ietf-tools/idnits-mirror/raw/main/idnits \
            -o /usr/local/bin/idnits || true
          chmod +x /usr/local/bin/idnits || true

      - name: Run draft-ietf checks
        run: bash scripts/check-draft-ietf.sh

      - name: Upload rendered draft
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-rendered
          path: |
            draft-ietf/*.txt
            draft-ietf/*.html
          if-no-files-found: warn
