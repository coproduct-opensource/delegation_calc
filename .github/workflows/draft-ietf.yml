name: IETF Draft

# Builds and validates the draft-ietf/draft-crisp-dlc-token-00.xml via
# xml2rfc + idnits per the audit closure checklist (item 6).

on:
  push:
    branches: ["main"]
    paths:
      - "draft-ietf/**"
      - "scripts/check-draft-ietf.sh"
      - ".github/workflows/draft-ietf.yml"
  pull_request:
    paths:
      - "draft-ietf/**"
      - "scripts/check-draft-ietf.sh"
      - ".github/workflows/draft-ietf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: draft-ietf xml2rfc + idnits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install xml2rfc + xmllint + idnits
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y python3-pip libxml2-utils
          pip3 install --quiet xml2rfc
          # idnits3 is a Node.js CLI distributed via npm; the previous
          # shell version (v2) is unmaintained and the old direct-curl
          # URL fetched a GitHub 404 HTML page rather than the script.
          # ubuntu-24.04 ships Node 20 by default; npm is already on PATH.
          sudo npm install -g @ietf-tools/idnits
          idnits --version || true

      - name: Run draft-ietf checks
        run: bash scripts/check-draft-ietf.sh

      - name: Upload rendered draft
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-rendered
          path: |
            draft-ietf/*.txt
            draft-ietf/*.html
          if-no-files-found: warn
