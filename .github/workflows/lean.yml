name: Lean 4

# Builds the DLC Lean libraries: hand-written syntax/judgment modules plus
# the four-theorem files. Soundness checks: forbid `sorry` and print axioms.
#
# M1.Q4.a wired in the cross-repo dependency on nucleus's `portcullisCore`.
# The job checks out `coproduct-opensource/nucleus` as a sibling at
# `../nucleus`, matching `lean/lakefile.lean`'s `require portcullisCore from
# "../../nucleus/crates/portcullis-core/lean"`. The nucleus pin is `main`;
# breakages from upstream surface via Aeneas drift and Lean build CI before
# they land in a merged DLC change.

on:
  push:
    branches: ["main"]
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "lean/**"
      - ".github/workflows/lean.yml"
  merge_group:
  # Weekly canary so Mathlib drift surfaces before it lands in a PR.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-build:
    name: lake build DLC
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          path: delegation_calc

      # Sibling clone of nucleus for the lakefile's relative-path `require
      # portcullisCore from "../../nucleus/...".  Pinned to `main` for now;
      # bumping to a specific commit hash is a follow-up once nucleus tags
      # the version DLC's Lean image is verified against.
      - name: Check out nucleus (sibling)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          repository: coproduct-opensource/nucleus
          path: nucleus
          ref: main

      # Sets up elan, layers the canonical Lake/Mathlib cache, hydrates
      # prebuilt Mathlib oleans, and runs `lake build DLC`. Replaces
      # ~30 lines of hand-rolled boilerplate; same semantics.
      - uses: coproduct-opensource/lean-mathlib-cache@9f69375ab6b89d215afa6938964e0200f15cd9ed # v1.0.1
        with:
          lean-project-dir: delegation_calc/lean
          build-target: DLC
          cache-key-prefix: lean

      - name: lake build per-theorem libraries
        working-directory: delegation_calc/lean
        # Every `lean_lib` in lakefile.lean must be built here or explicitly
        # excluded. A lib that is neither is a SILENT GATE OUTAGE, not a
        # missing build: check-axioms.sh imports across libs, so a single
        # unbuilt olean makes `lake env lean` fail and the axiom soundness
        # gate stops running altogether — while the job still reports the
        # failure as a generic step error.
        #
        # This is not hypothetical. #102 (2026-07-03) added `lean_lib
        # «CtxWellFormed»` and imported DLC.CtxWellFormed into the axiom
        # script, but not to this list. The axiom gate was dark from
        # 2026-07-03 to 2026-07-20 — three weekly canaries — on a codebase
        # that had just deleted an axiom found refutable in-system.
        run: |
          LIBS="Decidability CtxWellFormed Correspondence NonInterference \
                ObligationSoundness ProtocolCorrespondence Progress Witness \
                CoproductAlgebra GradedBridge GradedDistributiveLaw GradedBridgeGeneric \
                CarveProto DerivClosed CarveCtx CarveJudgment DecideDecode \
                CloneId DecideSquare AttenuateNarrows DLCD \
                DLCAeneas DLCDRsmAeneas DLCDCorrespondence DLCDTransport \
                DLCDTransportNI DLCDTransportConsensus"
          # DLC: built by the lean-mathlib-cache action above (build-target: DLC).
          # DLCAeneas / DLCDRsmAeneas: Aeneas-generated translations of
          # crates/dlc-core and crates/dlc-d-rsm. Still drift-gated by
          # scripts/check-drift.sh (dual-diff); now ALSO compiled + sorry/axiom
          # gated here (R2.2a-unblock: the DlcCore tree was made to elaborate by
          # opacifying the recursive derived Debug/Hash impls — see
          # DlcCore/FunsExternal.lean — and un-shadowing the `obligation`/
          # `principal` names). R2.1 ships no correspondence proof, so the
          # DlcDRsm tree remains an artifact, but it must at least compile.
          EXCLUDED="DLC"

          missing=""
          for lib in $(grep -oE 'lean_lib «[A-Za-z0-9_]+»' lakefile.lean \
                       | sed 's/lean_lib «//; s/»//'); do
            case " $LIBS $EXCLUDED " in
              *" $lib "*) ;;
              *) missing="$missing $lib" ;;
            esac
          done
          if [ -n "$missing" ]; then
            echo "::error::lean_lib(s) declared in lakefile.lean but not wired into CI:$missing"
            echo "Add each to LIBS in this step, or to EXCLUDED with a reason."
            exit 1
          fi

          for lib in $LIBS; do
            echo "::group::lake build $lib"
            lake build "$lib"
            echo "::endgroup::"
          done

      - name: Forbid sorry in proof terms
        # Matches `:= sorry`, `:= by sorry`, and tactic-line `sorry`
        # (a bare `sorry` at the start of a line inside a `by` block).
        # Prose mentions of the word in comments (`-- ... sorry ...`)
        # do not trip the gate (ledger.sh uses the same regexes).
        run: |
          if grep -rEn '(:=[[:space:]]+sorry|:=[[:space:]]+by[[:space:]]+sorry|^[[:space:]]*sorry([[:space:]]|$))' delegation_calc/lean/DLC/ delegation_calc/lean/DLCD/ --include='*.lean'; then
            echo "::error::Lean proofs contain `sorry` — soundness gate failed."
            exit 1
          fi
          echo "No sorry — soundness gate passes."

      - name: Check axioms against expected-axioms snapshots
        working-directory: delegation_calc
        # Compares `#print axioms <theorem>` against
        # `lean/expected-axioms/<theorem>.txt` for every tracked theorem.
        # Any new axiom dependency (or removed one) is a hard CI failure —
        # axiom drift is a silent soundness regression.
        run: bash scripts/check-axioms.sh

      - name: Forbid tautological placeholder statements
        working-directory: delegation_calc
        # Phase-0 tripwire: `True`-bodied Props and `x = x` self-equality
        # placeholders defeat the no-sorry gate while proving nothing.
        run: bash scripts/check-tautologies.sh

      - name: Public claims may not exceed ledger status
        working-directory: delegation_calc
        # README/RELEASES/paper/draft-ietf are checked against
        # lean/theorem-status.json — overclaims are a build failure.
        run: bash scripts/check-claims.sh
