name: Verification Ledger

# Aggregator workflow. Runs `scripts/ledger.sh` and publishes `ledger.json`
# as a workflow artifact (and as a release artifact on tags).
#
# Reproducible under `nix run .#ledger` — once the Nix flake lands at M1.Q3,
# the artifact this workflow produces is byte-identical to the local run.

on:
  push:
    branches: ["main"]
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger:
    name: Emit ledger.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
      - name: Install tokei
        run: cargo install tokei --version 12.1.2 --locked
      - name: Run ledger
        run: bash scripts/ledger.sh

      - name: Upload ledger artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ledger-json
          path: ledger.json
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ledger.json
