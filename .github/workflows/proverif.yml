name: ProVerif

# Runs the DLC ProVerif cross-check (L2.2).
# Mirrors models/tamarin/dlc.spthy properties via an independent symbolic
# prover. Catches model bugs that happen to slip past one tool's heuristics.

on:
  push:
    branches: ["main"]
    paths:
      - "models/proverif/**"
      - ".github/workflows/proverif.yml"
  pull_request:
    paths:
      - "models/proverif/**"
      - ".github/workflows/proverif.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: proverif on dlc.pv
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Cache opam state
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
          key: opam-proverif-${{ runner.os }}-2.05

      - name: Install opam + ProVerif
        run: |
          sudo apt-get update
          # libgtk2.0-dev is required by lablgtk (transitive proverif dep).
          # pkg-config is required by conf-pkg-config.
          sudo apt-get install -y opam libgtk2.0-dev pkg-config
          opam init -y --disable-sandboxing --bare
          eval $(opam env)
          opam switch list | grep -q "default " || opam switch create default 4.14.1
          eval $(opam env)
          # --assume-depexts: don't reprompt for system packages we just
          # installed via apt above.
          opam install -y --assume-depexts proverif
          eval $(opam env)
          # ProVerif has no --version flag; its banner prints on -help.
          # Capture just the first line as the version readout.
          proverif -help 2>&1 | head -1 || true

      - name: Run ProVerif on dlc.pv
        run: |
          eval $(opam env)
          cd models/proverif
          proverif dlc.pv 2>&1 | tee prove.log

          # ProVerif reports `RESULT <query> is true` or `is false` per
          # query. For correspondence assertions (secrecy_ltk,
          # non_splicing) we require `is true`. For the existence query
          # `not event(DelegateAccept)` we require `is false` (because a
          # falsified negation means the event IS reachable -- the
          # standard ProVerif idiom for existence queries).
          ok=1
          # Original three queries.
          if ! grep -qE "^RESULT event\(HonestSk.*attacker.*is true" prove.log; then
            echo "::error::secrecy_ltk did not prove"
            ok=0
          fi
          if ! grep -qE "^RESULT event\(DelegateAccept.*SpeaksForIssued.*is true" prove.log; then
            echo "::error::non_splicing did not prove"
            ok=0
          fi
          if ! grep -qE "^RESULT not event\(DelegateAccept.*is false" prove.log; then
            echo "::error::exec_delegation did not show reachability"
            ok=0
          fi
          # Extended queries per audit item 3 — 4 categories, ≥7 queries.
          # secrecy_payload: ProVerif checks `not attacker(secret)`; success = is true.
          if ! grep -qE "^RESULT not attacker\(dlc_secret_payload.* is true" prove.log; then
            echo "::error::secrecy_payload did not prove"
            ok=0
          fi
          # says_authentication: REMOVED 2026-07-20 -- it asserted a tautology
          # (event(Says) ==> event(Says) || ...), proving `is true` while
          # checking nothing. A plain says has no standalone verifier-accept
          # event to key a correspondence on; the guarantee is subsumed by
          # non_splicing / no_silent_discharge / discharge_traces_to_box. See
          # the note at its former site in models/proverif/dlc.pv. No gate
          # assertion replaces it, so that no green result implies an
          # authentication check that is not performed.
          # Guard the SOURCE against silent reintroduction of the vacuous form
          # (premise event repeated verbatim as a conclusion disjunct). Flatten
          # newlines first so the check is portable and line-break-insensitive.
          if tr -d '\n' < dlc.pv | grep -qE "event\(Says\(P, prop\)\) *==> *event\(Says\(P, prop\)\)"; then
            echo "::error::vacuous says_authentication tautology reintroduced in dlc.pv"
            ok=0
          fi
          # delegate_implies_speaks_for: correspondence; success = is true.
          # (Replaces the original speaks_for_origin query, whose
          # tuple-equality form SpeaksForIssued ==> Says(P, (sft,P,Q))
          # sits outside ProVerif's Horn-clause saturation horizon.)
          if ! grep -qE "^RESULT event\(DelegateAccept.*==> event\(SpeaksForIssued\(P,Q\)\) \|\| event\(LtkReveal.* is true" prove.log; then
            echo "::error::delegate_implies_speaks_for did not prove"
            ok=0
          fi
          # speaks_for_reachable: existence; success = is false (negation falsified).
          if ! grep -qE "^RESULT.*SpeaksForIssued.* is false" prove.log; then
            echo "::error::speaks_for_reachable did not show reachability"
            ok=0
          fi
          # Generic catch-all: any unexpected `cannot be proved` is a failure.
          if grep -E "^RESULT.*cannot be proved" prove.log; then
            echo "::error::ProVerif could not prove a query"
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1
          echo "dlc.pv: all 7 queries (3 original + 4 extended) match expected outcomes."

      - name: Run ProVerif on dlc-equiv.pv (observational equivalence)
        # ProVerif rejects mixing `choice[]` biprocess analysis with
        # correspondence/secrecy queries in one file ("Queries are
        # incompatible with choice."), so the fourth audit-item-3 query
        # category lives in a sibling file. Both files must pass for the
        # CI gate to go green.
        run: |
          eval $(opam env)
          cd models/proverif
          proverif dlc-equiv.pv 2>&1 | tee prove-equiv.log
          if ! grep -qiE "^RESULT.*[Oo]bservational equivalence.* is true" prove-equiv.log; then
            echo "::error::twin_freshness observational equivalence did not prove"
            exit 1
          fi
          if grep -E "^RESULT.*cannot be proved" prove-equiv.log; then
            echo "::error::ProVerif could not prove the equivalence"
            exit 1
          fi
          echo "dlc-equiv.pv: observational equivalence holds."

      # =====================================================================
      # The DLC-D REPLICATION cross-check (R6.1b step 2). Companion to the
      # Tamarin theory of the same name; see spec/r6-1b-replication-protocol.md
      # for the division of labour (slot agreement is Tamarin-only — it needs
      # linear resources, which ProVerif's monotonic Horn translation cannot
      # express).
      # =====================================================================
      - name: Run ProVerif on dlcd-replication.pv
        run: |
          eval $(opam env)
          cd models/proverif
          proverif dlcd-replication.pv 2>&1 | tee prove-replication.log

          ok=1
          # Correspondences: require `is true`.
          if ! grep -qE "^RESULT event\(HonestSk.*attacker.*is true" prove-replication.log; then
            echo "::error::replication secrecy_ltk did not prove"; ok=0
          fi
          if ! grep -qE "^RESULT event\(Applied.*CapIssued.*is true" prove-replication.log; then
            echo "::error::applied_implies_capability did not prove"; ok=0
          fi
          if ! grep -qE "^RESULT event\(Applied.*Voted.*is true" prove-replication.log; then
            echo "::error::applied_implies_vote did not prove"; ok=0
          fi
          if ! grep -qE "^RESULT event\(Applied.*Proposed.*is true" prove-replication.log; then
            echo "::error::applied_implies_proposal did not prove"; ok=0
          fi
          # The load-bearing one: the voter's own capability check, with the
          # escape bound to the NAMED issuer so a compromised leader cannot
          # void it. Deleting that check falsifies this query.
          if ! grep -qE "^RESULT event\(CapCheckedBy.*CapIssued.*is true" prove-replication.log; then
            echo "::error::cap_check_binds_issuer did not prove"; ok=0
          fi
          # Reachability (anti-vacuity): `is false` for the negation IS the pass.
          if ! grep -qE "^RESULT not event\(Applied.*is false" prove-replication.log; then
            echo "::error::applied_reachable: Applied is unreachable — the correspondences above are VACUOUS"; ok=0
          fi
          if ! grep -qE "^RESULT not event\(CapCheckedBy.*is false" prove-replication.log; then
            echo "::error::cap_checked_reachable: the capability-check path never executes"; ok=0
          fi
          # No query may come back unproved.
          if grep -E "^RESULT.*cannot be proved" prove-replication.log; then
            echo "::error::a replication query could not be proved"; ok=0
          fi
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "dlcd-replication.pv: all queries as expected."

      # =====================================================================
      # Phase 2 interop cross-check (spec/interop-says-biscuit.md). Companion to
      # models/tamarin/dlcd-interop.spthy — must AGREE on the security properties.
      # =====================================================================
      - name: Run ProVerif on dlcd-interop.pv
        run: |
          eval $(opam env)
          cd models/proverif
          proverif dlcd-interop.pv 2>&1 | tee prove-interop.log

          ok=1
          # Correspondences (require `is true`): forgery-resistance + audience
          # binding, and attenuation-monotone — both scoped to honest issuers.
          if ! grep -qE "^RESULT event\(Accepted.*HonestIssuer.*CredIssued.*is true" prove-interop.log; then
            echo "::error::interop cred_binds_issuer / audience-binding did not prove"; ok=0
          fi
          if ! grep -qE "^RESULT event\(AttAccepted.*HonestIssuer.*CredIssued.*is true" prove-interop.log; then
            echo "::error::interop attenuation_roots_in_issuance did not prove"; ok=0
          fi
          # Reachability (anti-vacuity): `is false` for the negation IS the pass.
          if ! grep -qE "^RESULT not event\(Accepted.*is false" prove-interop.log; then
            echo "::error::interop Accepted is unreachable — the correspondences are VACUOUS"; ok=0
          fi
          if ! grep -qE "^RESULT not event\(AttAccepted.*is false" prove-interop.log; then
            echo "::error::interop AttAccepted is unreachable — the attenuation path never executes"; ok=0
          fi
          if grep -E "^RESULT.*cannot be proved" prove-interop.log; then
            echo "::error::an interop query could not be proved"; ok=0
          fi
          if [ "$ok" -ne 1 ]; then exit 1; fi
          echo "dlcd-interop.pv: all queries as expected."

      - name: Upload ProVerif output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proverif-output
          path: models/proverif/*.log
          if-no-files-found: warn
