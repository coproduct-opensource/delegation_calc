name: Tamarin

# Runs the DLC symbolic-model lemmas against the Tamarin prover.
# Phase-2 L2.1 deliverable: NonSplicing + Auth + Secrecy + Executability.
#
# Install approach: apt for Maude+GraphViz; pre-built Tamarin binary from
# the upstream GitHub release. Using ubuntu-24.04 because the eikendev
# docker image's bundled Maude depends on libtinfo5 which isn't shipped
# on newer Ubuntu.

on:
  push:
    branches: ["main"]
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  pull_request:
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: tamarin-prover on dlc.spthy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Bumped 1.10.0 -> 1.12.0 (2026-07-24) when the replication models landed:
      # all three theories were verified locally under 1.12.0, so CI runs the
      # version the models were actually proved against rather than an older one
      # nobody re-checked. dlc.spthy's 7 lemmas still verify under 1.12.0.
      TAMARIN_VERSION: "1.12.0"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Maude and GraphViz
        run: |
          sudo apt-get update
          sudo apt-get install -y maude graphviz
          maude --version || true

      - name: Install Tamarin binary
        run: |
          curl -L -o tamarin.tar.gz \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          tar -xzf tamarin.tar.gz
          sudo mv tamarin-prover /usr/local/bin/
          tamarin-prover --version

      # STRICT since 2026-07-24: the sentinel must be PRESENT, asserted
      # positively. Before that date this step only tee'd the log, and
      # dlc.spthy's message-derivation failure ("Failed to derive Variable(s):
      # skP, skQ") rode along for the file's whole lifetime — Tamarin appending
      # "The analysis results might be wrong!" to a run the gate called green.
      # The rules now use the derivation-clean `verify(...)` idiom and the file
      # is warning-free, so the gate can be strict.
      - name: Well-formedness check (strict — zero warnings required)
        run: |
          set -o pipefail
          cd models/tamarin
          tamarin-prover dlc.spthy 2>&1 | tee wellformedness.log
          if ! grep -q "All wellformedness checks were successful" wellformedness.log; then
            echo "::error::dlc.spthy has wellformedness warnings — Tamarin's analysis may be unsound"
            exit 1
          fi

      - name: Prove all lemmas
        run: |
          set -o pipefail
          cd models/tamarin
          # pipefail makes a tamarin-prover crash fail the step -- without it,
          # `tee` returns 0 and a prover that never proved anything (segfault,
          # parse error) would slip past the grep below with an empty log.
          tamarin-prover --prove dlc.spthy 2>&1 | tee prove.log

          # (1) Fail if any lemma was falsified or left incomplete.
          if grep -E "^.*: (falsified|incomplete)" prove.log; then
            echo "::error::Tamarin reported falsified or incomplete lemmas"
            exit 1
          fi

          # (2) Fail if Tamarin did not run to a summary -- a truncated run
          # (timeout, OOM) can exit 0 with no falsified lines.
          if ! grep -q "summary of summaries" prove.log; then
            echo "::error::Tamarin did not reach 'summary of summaries' -- run truncated"
            exit 1
          fi

          # (3) Positively assert EACH expected lemma verified. The old gate
          # only checked for falsification, so a silently deleted or renamed
          # lemma (no falsified line) passed while proving nothing -- the same
          # "green gate that checks nothing" defect fixed for ProVerif in the
          # says_authentication removal. Keep this list in sync with the
          # `lemma` declarations in dlc.spthy.
          ok=1
          for lem in secrecy_ltk exec_honest_ltk non_splicing exec_delegation \
                     no_silent_discharge one_shot_discharge exec_discharge; do
            if ! grep -qE "\b${lem}\b.*: +verified" prove.log; then
              echo "::error::Tamarin lemma '${lem}' did not verify (missing, renamed, or not proved)"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamarin-output
          path: models/tamarin/*.log
          if-no-files-found: warn

  # ===========================================================================
  # The DLC-D REPLICATION models (R6.1b step 1). Separate job so a failure here
  # names the replication protocol rather than the delegation protocol.
  # ===========================================================================
  replication:
    name: tamarin-prover on the replication models
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAMARIN_VERSION: "1.12.0"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Maude and GraphViz
        run: |
          sudo apt-get update
          sudo apt-get install -y maude graphviz
          maude --version || true

      - name: Install Tamarin binary
        run: |
          curl -L -o tamarin.tar.gz \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          tar -xzf tamarin.tar.gz
          sudo mv tamarin-prover /usr/local/bin/
          tamarin-prover --version

      # ZERO wellformedness warnings, asserted POSITIVELY (the success sentinel
      # must be present), not by grepping for known-bad strings. Same standard
      # as the dlc.spthy job — both files use the derivation-clean `verify(...)`
      # idiom, so neither has anything to suppress. (Until 2026-07-24 dlc.spthy
      # did report a message-derivation failure and only this job was strict;
      # that model has since been converted and re-proved.)
      - name: Well-formedness (strict — zero warnings required)
        run: |
          set -o pipefail
          cd models/tamarin
          for f in dlcd-replication.spthy dlcd-replication-bite.spthy dlcd-interop.spthy; do
            tamarin-prover "$f" 2>&1 | tee "wf-${f%.spthy}.log"
            if ! grep -q "All wellformedness checks were successful" "wf-${f%.spthy}.log"; then
              echo "::error::${f} has wellformedness warnings — Tamarin's analysis may be unsound"
              exit 1
            fi
          done

      - name: Prove the replication lemmas
        run: |
          set -o pipefail
          cd models/tamarin
          tamarin-prover --prove dlcd-replication.spthy 2>&1 | tee prove-replication.log
          tamarin-prover --prove dlcd-replication-bite.spthy 2>&1 | tee prove-bite.log

          for log in prove-replication.log prove-bite.log; do
            if grep -E "^.*: (falsified|incomplete)" "$log"; then
              echo "::error::Tamarin reported falsified or incomplete lemmas in ${log}"
              exit 1
            fi
            if ! grep -q "summary of summaries" "$log"; then
              echo "::error::${log}: Tamarin did not reach 'summary of summaries' — run truncated"
              exit 1
            fi
          done

          # Positively assert EACH lemma verified, so a deleted or renamed lemma
          # fails loudly instead of passing by proving nothing. Keep in sync with
          # the `lemma` declarations in both theories.
          ok=1
          for lem in applied_implies_quorum applied_implies_capability \
                     slot_agreement cap_check_binds_issuer \
                     exec_apply exec_cap_checked; do
            if ! grep -qE "\b${lem}\b.*: +verified" prove-replication.log; then
              echo "::error::lemma '${lem}' did not verify in dlcd-replication.spthy"
              ok=0
            fi
          done
          # The BITE: a VERIFIED exists-trace here means the attack is reachable
          # once the one-vote guard is gone. If this stops verifying, the bite has
          # gone vacuous and is no longer evidence for anything.
          if ! grep -qE "\bdisagreement_reachable\b.*: +verified" prove-bite.log; then
            echo "::error::the bite lemma 'disagreement_reachable' did not verify — the bite is vacuous"
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then exit 1; fi

      # The differential. Both theories passing INDEPENDENTLY does not show the
      # guard is what makes agreement true — see the script's header.
      - name: Bite is a controlled experiment (differential gate)
        run: bash scripts/check-tamarin-bite.sh

      # Phase 2 interop model (spec/interop-says-biscuit.md): the says-credential ↔
      # Biscuit/RFC-8707 protocol — forgery-resistance, audience-binding, offline
      # attenuation (never widens), non-vacuity; + the differential bite.
      - name: Interop wellformedness (strict — zero warnings)
        run: |
          set -o pipefail
          cd models/tamarin
          for f in dlcd-interop.spthy dlcd-interop-bite.spthy; do
            tamarin-prover "$f" 2>&1 | tee "wf-${f%.spthy}.log"
            if ! grep -q "All wellformedness checks were successful" "wf-${f%.spthy}.log"; then
              echo "::error::${f} has wellformedness warnings — Tamarin's analysis may be unsound"
              exit 1
            fi
          done

      - name: Prove the interop lemmas
        run: |
          set -o pipefail
          cd models/tamarin
          tamarin-prover --prove dlcd-interop.spthy 2>&1 | tee prove-interop.log
          tamarin-prover --prove dlcd-interop-bite.spthy 2>&1 | tee prove-interop-bite.log
          for log in prove-interop.log prove-interop-bite.log; do
            if grep -E "^.*: (falsified|incomplete)" "$log"; then
              echo "::error::Tamarin reported falsified or incomplete lemmas in ${log}"
              exit 1
            fi
            if ! grep -q "summary of summaries" "$log"; then
              echo "::error::${log}: Tamarin did not reach 'summary of summaries' — run truncated"
              exit 1
            fi
          done
          ok=1
          for lem in cred_binds_issuer no_cross_audience_replay exec_accept \
                     attenuation_roots_in_issuance exec_attenuate; do
            if ! grep -qE "\b${lem}\b.*: +verified" prove-interop.log; then
              echo "::error::lemma '${lem}' did not verify in dlcd-interop.spthy"
              ok=0
            fi
          done
          # The BITE: cross-audience replay must be REACHABLE once AudienceBinding is
          # gone. If this stops verifying, the bite has gone vacuous.
          if ! grep -qE "\bcross_audience_reachable\b.*: +verified" prove-interop-bite.log; then
            echo "::error::the interop bite lemma 'cross_audience_reachable' did not verify — the bite is vacuous"
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then exit 1; fi

      # The differential: both passing independently does not show AudienceBinding
      # is what makes audience binding true — see the script's header.
      - name: Interop bite is a controlled experiment (differential gate)
        run: bash scripts/check-tamarin-interop-bite.sh

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamarin-replication-output
          path: models/tamarin/*.log
          if-no-files-found: warn
