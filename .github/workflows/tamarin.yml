name: Tamarin

# Runs the DLC symbolic-model lemmas against the Tamarin prover.
# Phase-2 L2.1 deliverable: NonSplicing + Auth + Secrecy + Executability.
#
# Uses the eikendev/tamarin-prover Docker image (the most actively
# maintained community image as of 2026). Pinned digest is updated when
# the upstream Tamarin release moves; bumps go through dependabot.

on:
  push:
    branches: ["main"]
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  pull_request:
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  # Weekly canary catches drift in Tamarin's heuristics that might affect
  # our lemma decisions.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: tamarin-prover on dlc.spthy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/eikendev/tamarin-prover:latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: tamarin-prover --version
        run: tamarin-prover --version

      - name: Well-formedness check
        run: |
          cd models/tamarin
          tamarin-prover --quit-on-warning dlc.spthy > wellformedness.log 2>&1 || (cat wellformedness.log; exit 1)
          echo "=== Well-formedness output ==="
          cat wellformedness.log

      - name: Prove all lemmas
        run: |
          cd models/tamarin
          tamarin-prover --prove dlc.spthy > prove.log 2>&1 || (cat prove.log; exit 1)
          echo "=== Proof output ==="
          cat prove.log
          # Fail if any lemma was "falsified" or returned "incomplete"
          if grep -E "^[[:space:]]*[a-z_]+ .*: (falsified|incomplete)" prove.log; then
            echo "::error::Tamarin reported falsified or incomplete lemmas"
            exit 1
          fi

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamarin-output
          path: models/tamarin/*.log
          if-no-files-found: warn
