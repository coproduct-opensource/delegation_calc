name: Tamarin

# Runs the DLC symbolic-model lemmas against the Tamarin prover.
# Phase-2 L2.1 deliverable: NonSplicing + Auth + Secrecy + Executability.
#
# Install approach: apt for Maude+GraphViz; pre-built Tamarin binary from
# the upstream GitHub release. Using ubuntu-24.04 because the eikendev
# docker image's bundled Maude depends on libtinfo5 which isn't shipped
# on newer Ubuntu.

on:
  push:
    branches: ["main"]
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  pull_request:
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: tamarin-prover on dlc.spthy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAMARIN_VERSION: "1.10.0"

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Maude and GraphViz
        run: |
          sudo apt-get update
          sudo apt-get install -y maude graphviz
          maude --version || true

      - name: Install Tamarin binary
        run: |
          curl -L -o tamarin.tar.gz \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          tar -xzf tamarin.tar.gz
          sudo mv tamarin-prover /usr/local/bin/
          tamarin-prover --version

      - name: Well-formedness check
        run: |
          cd models/tamarin
          tamarin-prover dlc.spthy 2>&1 | tee wellformedness.log

      - name: Prove all lemmas
        run: |
          cd models/tamarin
          tamarin-prover --prove dlc.spthy 2>&1 | tee prove.log
          # Fail if any lemma was falsified or any output indicates failure.
          if grep -E "^.*: (falsified|incomplete)" prove.log; then
            echo "::error::Tamarin reported falsified or incomplete lemmas"
            exit 1
          fi

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamarin-output
          path: models/tamarin/*.log
          if-no-files-found: warn
