name: Tamarin

# Runs the DLC symbolic-model lemmas against the Tamarin prover.
# Phase-2 L2.1 deliverable: NonSplicing + Auth + Secrecy + Executability.
#
# Install approach: apt for Maude+GraphViz; pre-built Tamarin binary from
# the upstream GitHub release. Using ubuntu-24.04 because the eikendev
# docker image's bundled Maude depends on libtinfo5 which isn't shipped
# on newer Ubuntu.

on:
  push:
    branches: ["main"]
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  pull_request:
    paths:
      - "models/tamarin/**"
      - ".github/workflows/tamarin.yml"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: tamarin-prover on dlc.spthy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAMARIN_VERSION: "1.10.0"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Install Maude and GraphViz
        run: |
          sudo apt-get update
          sudo apt-get install -y maude graphviz
          maude --version || true

      - name: Install Tamarin binary
        run: |
          curl -L -o tamarin.tar.gz \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz"
          tar -xzf tamarin.tar.gz
          sudo mv tamarin-prover /usr/local/bin/
          tamarin-prover --version

      - name: Well-formedness check
        run: |
          cd models/tamarin
          tamarin-prover dlc.spthy 2>&1 | tee wellformedness.log

      - name: Prove all lemmas
        run: |
          set -o pipefail
          cd models/tamarin
          # pipefail makes a tamarin-prover crash fail the step -- without it,
          # `tee` returns 0 and a prover that never proved anything (segfault,
          # parse error) would slip past the grep below with an empty log.
          tamarin-prover --prove dlc.spthy 2>&1 | tee prove.log

          # (1) Fail if any lemma was falsified or left incomplete.
          if grep -E "^.*: (falsified|incomplete)" prove.log; then
            echo "::error::Tamarin reported falsified or incomplete lemmas"
            exit 1
          fi

          # (2) Fail if Tamarin did not run to a summary -- a truncated run
          # (timeout, OOM) can exit 0 with no falsified lines.
          if ! grep -q "summary of summaries" prove.log; then
            echo "::error::Tamarin did not reach 'summary of summaries' -- run truncated"
            exit 1
          fi

          # (3) Positively assert EACH expected lemma verified. The old gate
          # only checked for falsification, so a silently deleted or renamed
          # lemma (no falsified line) passed while proving nothing -- the same
          # "green gate that checks nothing" defect fixed for ProVerif in the
          # says_authentication removal. Keep this list in sync with the
          # `lemma` declarations in dlc.spthy.
          ok=1
          for lem in secrecy_ltk exec_honest_ltk non_splicing exec_delegation \
                     no_silent_discharge one_shot_discharge exec_discharge; do
            if ! grep -qE "\b${lem}\b.*: +verified" prove.log; then
              echo "::error::Tamarin lemma '${lem}' did not verify (missing, renamed, or not proved)"
              ok=0
            fi
          done
          if [ "$ok" -ne 1 ]; then exit 1; fi

      - name: Upload Tamarin output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tamarin-output
          path: models/tamarin/*.log
          if-no-files-found: warn
