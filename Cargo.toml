[workspace]
members = [
    "crates/dlc-core",
    "crates/dlc-d-rsm",
    "crates/dlc-d-node",
    "crates/dlc-d-macro",
    "crates/dlc-d",
    "crates/dlc-interop",
    "crates/dlc-crypto",
    "crates/dlc-protocol",
    "crates/dlc-verifier",
    "crates/dlc-verifier-wasm",
    "crates/dlc-cli",
    "crates/dlc-bench",
    "crates/dlc-fuzz",
]
# Depends on the PRIVATE `coproduct-algebra` — kept OUT of the public workspace so
# `cargo --workspace` (and public CI) never resolves that path. Build it standalone
# with a sibling coproduct-algebra checkout.
exclude = ["crates/dlc-grade-quantale"]
resolver = "2"

[workspace.package]
version = "1.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Coproduct <hello@coproduct.dev>"]
repository = "https://github.com/coproduct-dev/delegation_calc"
homepage = "https://dlc.coproduct.dev"
documentation = "https://docs.rs/dlc-core"

[workspace.dependencies]
# Crypto (matches nucleus pins where possible)
ed25519-dalek = { version = "2", default-features = false }
sha2 = { version = "0.11", default-features = false }
ciborium = "0.2"
coset = "0.3"

# Diagnostics
thiserror = "2"
anyhow = "1"

# Proc-macro toolkit (dlc-d-macro only — NOT dlc-core, whose Aeneas fence bans deps)
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# Async / runtime (only for non-core crates)
tokio = { version = "1.52", features = ["rt", "rt-multi-thread", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bench / fuzz
criterion = "0.5"
libfuzzer-sys = "0.4"

# Nucleus integration — GIT PINS (not path deps): a path dep to a sibling
# checkout cannot be published to crates.io, which blocked `dlc-*`. Pinned to
# coproduct-opensource/nucleus (PUBLIC), so external consumers can build the
# dlc crates. Rev is converged across spiffy/proof-dag/delegation_calc as part
# of the PCA-SDK unification; bump all three together.
portcullis-core = { git = "https://github.com/coproduct-opensource/nucleus.git", rev = "9465c7935877469d871cc736f973092c0f8a35e4" }
portcullis = { git = "https://github.com/coproduct-opensource/nucleus.git", rev = "9465c7935877469d871cc736f973092c0f8a35e4" }
nucleus-identity = { git = "https://github.com/coproduct-opensource/nucleus.git", rev = "9465c7935877469d871cc736f973092c0f8a35e4" }
nucleus-lineage = { git = "https://github.com/coproduct-opensource/nucleus.git", rev = "9465c7935877469d871cc736f973092c0f8a35e4" }

[workspace.lints.clippy]
# dlc-core must remain Aeneas/Charon-translatable. The crate-level lints in
# crates/dlc-core/src/lib.rs forbid the AST surfaces (trait objects, async,
# complex lifetimes) that Aeneas cannot translate.
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
