[package]
name = "dlc-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Criterion benches verifying T1's O(|M| · log |Γ|) complexity bound"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dlc-core = { path = "../dlc-core", version = "1.5.0" }
dlc-verifier = { path = "../dlc-verifier", version = "1.5.0" }
dlc-crypto = { path = "../dlc-crypto", version = "1.5.0" }
dlc-protocol = { path = "../dlc-protocol", version = "1.5.0" }

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "bench-vectors"
path = "src/bin/bench_vectors.rs"
