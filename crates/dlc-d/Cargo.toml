[package]
name = "dlc-d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The dlc_d facade: the #[dlc_d::agent_service] macro + the Tier-1 authority-envelope type vocabulary (Cap / Invoke / FlowsInto / Faults). Enforces admission, flow, and budget as ordinary rustc type errors; soundness of the Tier-2 obligation rides on the verified checker in dlc-core."

[lib]
path = "src/lib.rs"

[dependencies]
dlc-d-macro = { path = "../dlc-d-macro", version = "1.5.0" }
dlc-core = { path = "../dlc-core", version = "1.5.0" }
