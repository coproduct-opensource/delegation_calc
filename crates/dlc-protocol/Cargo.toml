[package]
name = "dlc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wire format for DLC proof terms; Tamarin/ProVerif exporters"

[lib]
path = "src/lib.rs"

[dependencies]
dlc-core = { path = "../dlc-core", version = "1.5.0" }
# NB: the `coproduct-algebra` (PRIVATE) dep + the DP-budget Quantale moved to the
# workspace-excluded `dlc-grade-quantale` crate, so this PUBLIC crate's build (and
# public CI) never resolves the private path. A feature-gate was insufficient —
# cargo loads an optional path dep's manifest regardless of features.
ciborium = { workspace = true }
coset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
