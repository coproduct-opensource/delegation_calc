[package]
name = "dlc-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wire format for DLC proof terms; Tamarin/ProVerif exporters"

[lib]
path = "src/lib.rs"

[features]
default = []
# The `grade_quantale` module depends on `coproduct-algebra`, a PRIVATE crate.
# delegation_calc is PUBLIC, so that dependency must NOT be in the default build:
# a public→private dep breaks public CI (which cannot clone the private repo) and
# violates the dependency boundary. Enable this feature locally — with a sibling
# `coproduct-algebra` checkout — to build the DP-budget quantale. Once
# `coproduct-algebra` is published/open-sourced, switch the dep to a version/git
# pin and this feature may become default.
grade-quantale = ["dep:coproduct-algebra"]

[dependencies]
dlc-core = { path = "../dlc-core", version = "1.5.0" }
# shared algebra substrate — the DP budget is the additive (non-idempotent) instance of its
# `Quantale`. Optional + PRIVATE → gated behind the `grade-quantale` feature (see above).
coproduct-algebra = { path = "../../../coproduct-algebra", optional = true }
ciborium = { workspace = true }
coset = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
