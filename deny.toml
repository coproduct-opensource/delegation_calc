# cargo-deny — license + ban + advisory policy for delegation_calc.
#
# Run locally:  cargo deny check
# Run in CI:    .github/workflows/deny.yml

[graph]
all-features = true

[output]
feature-depth = 1

# Advisories are covered by `cargo audit` in `.github/workflows/audit.yml`,
# not here. Reason: cargo-deny's advisory loader (as of 0.19.0) cannot parse
# CVSS 4.0 entries in the RustSec DB — see
# https://github.com/EmbarkStudios/cargo-deny/issues/804. Until that lands,
# we run advisory scanning only via the `rustsec/audit-check` action.

[licenses]
version = 2
# Allow-list of OSI-approved licenses compatible with MIT/Apache-2.0 dual-license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A workspace member depending on `dlc-core` MUST go via the path dep so the
# Aeneas-pinned version is used; an indirect crates.io pull would break T1's
# Rust↔Lean correspondence.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
